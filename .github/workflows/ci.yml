name: Text Analyzer CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 64/text-analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions
        run: |
          python --version
          pip --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: CI started
        run: echo "CI Pipeline Started"

      - name: Run tests
        run: pytest

      - name: Tests passed
        if: success()
        run: echo "All tests passed successfully!"