<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon">&#10003;</span>
        <h1>Todo Dashboard</h1>
      </div>
      <p class="header-sub">All your tasks in one place</p>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading...</div>
    <div id="error" class="error hidden"></div>

    <div class="controls">
      <input id="search" class="ctrl-input" type="search" placeholder="Search by title..." />
      <select id="filter-user" class="ctrl-select">
        <option value="">All users</option>
      </select>
      <select id="filter-status" class="ctrl-select">
        <option value="">All</option>
        <option value="true">Completed</option>
        <option value="false">Not completed</option>
      </select>
    </div>

    <div class="list-wrapper">
      <div class="list-header">
        <span id="page-info" class="page-info"></span>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>

    <nav id="pagination" class="pagination hidden"></nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
