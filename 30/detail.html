<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Detail</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="header-icon">&#10003;</span>
        <h1>Todo Detail</h1>
      </div>
      <p class="header-sub">Full information about this task</p>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading...</div>
    <div id="error" class="error hidden"></div>

    <div id="detail-card" class="detail-card hidden">
      <a href="index.html" class="back-btn">&#8592; Back to Todos</a>
      <div class="detail-fields">
        <div class="detail-row">
          <span class="detail-label">ID</span>
          <span id="d-id" class="detail-value"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">User ID</span>
          <span id="d-userId" class="detail-value"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Title</span>
          <span id="d-title" class="detail-value"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span id="d-completed" class="detail-value"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="detail.js"></script>
</body>
</html>
